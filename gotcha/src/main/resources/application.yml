spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}

jwt:
  secret-key: ${JWT_KEY}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  auto-login-refresh-expiration: ${JWT_AUTO_REFRESH_EXPIRATION}
  issuer: ${JWT_ISSUER}

token:
  refresh:
    in-cookie: ${COOKIE_REFRESH_EXPIRATION}
    in-redis: ${REDIS_REFRESH_EXPIRATION}

cache:
  ttl: ${CACHE_TTL}

mail:
  sender: Gotcha!
  subject: "[Gotcha!] 이메일 인증을 완료해주세요."

csrf:
  cookie:
    secure: false

server:
  address: 0.0.0.0

ai-server:
  url: ${AI_SERVER_API:https://jongsul.site/api/v1/}
