components:
  schemas:
    ExceptionRes:
      type: object
      description: API 예외 응답 구조
      properties:
        code:
          type: string
          description: 에러 코드
        status:
          type: integer
          format: int32
          description: HTTP 상태 코드
        message:
          type: string
          description: 에러 메시지
        fields:
          type: object
          description: 필드별 상세 오류 메시지 (있을 경우)
          additionalProperties:
            type: string
      required:
        - code
        - status
        - message

    CreateRoomRequest:
      type: object
      required:
        - title
        - maxUser
        - hasPassword
        - difficulty
        - gameType
        - roundCount
      properties:
        title:
          type: string
          description: 제목 (필수 입력)

        maxUser:
          type: integer
          description: 최대 인원수 (필수 입력)

        hasPassword:
          type: boolean
          description: 비밀번호 사용 여부

        password:
          type: string
          description: 문자열이 숫자 4자리로만 구성되어 있어야 한다

        difficulty:
          type: string
          enum: [BASIC, ADVANCED]
          description: 인공지능 난이도 (필수)

        gameType:
          type: string
          enum: [TRICK_MYOMYO, LULU_ART_EXAM]
          description: 묘묘 - 2인 / 루루 - 1인 게임 모드

        roundCount:
          type: integer
          minimum: 1
          maximum: 5
          description: 라운드 수 (1~5 사이)

    RoomReq:
      type: object
      required:
        - eventType
      properties:
        eventType:
          type: string
          enum: [CHAT, READY, JOIN, EXIT, UNREADY, START, OWNER_CHANGE, KICK]
          description: |
            클라이언트가 수행하고자 하는 이벤트의 종류입니다.
        content:
          type: string
          description: |
            이벤트에 따라 의미가 달라지는 콘텐츠입니다.
            - CHAT: 채팅 메시지
            - JOIN: 비밀번호가 있는 대기방의 경우 비밀번호, 비밀번호가 없다면 안보내도 됩니다.
            - KICK: 강퇴하고자 하는 사용자의 UUID
            - UPDATE: 방의 정보(title, hasPassword, password, difficulty, roundCount)를 json문자열 형태로 보냅니다.
            - OWNER_CHANGE: 방장 권한을 위임하고자 하는 사용자의 UUID
            - 나머지는 content를 사용하지 않습니다.

    RedisResponse_RoomMetadata:
      type: object
      description: 방 생성/요청 응답용 Redis 메시지 (RoomMetadata 포함)
      properties:
        userId:
          type: string
          description: 메시지를 보낸 사용자 UUID
        topic:
          type: string
          description: Redis로 발행된 채널명
        payload:
          $ref: '#/components/schemas/RoomMetadata'

    RoomSummaryRes:
      type: object
      properties:
        roomId:
          type: string
          description: 방 ID
        title:
          type: string
          description: 방 제목
        owner:
          type: string
          description: 방장 닉네임
        hasPassword:
          type: boolean
          description: 비밀번호 사용 여부
        maxUser:
          type: integer
          description: 최대 인원 수
        currentUser:
          type: integer
          description: 현재 인원 수

    RoomMetadata:
      type: object
      properties:
        id:
          type: string
          description: 방 ID
        title:
          type: string
          description: 방 제목
        owner:
          type: string
          description: 방장 닉네임
        hasPassword:
          type: boolean
          description: 비밀번호 사용 여부
        password:
          type: string
          description: 비밀번호 (빈 문자열일 수 있음)
        max:
          type: integer
          description: 최대 인원 수
        min:
          type: integer
          description: 최소 인원 수
        aiLevel:
          type: string
          enum: [BASIC, ADVANCED]
          description: AI 난이도
        gameMode:
          type: string
          enum: [TRICK_MYOMYO, LULU_ART_EXAM]
          description: 게임 모드
        ownerUuid:
          type: string
          description: |
            이 방을 생성한 사용자의 UUID입니다.  
            클라이언트는 해당 값을 통해 수신된 방 정보가 본인이 생성한 것인지 식별할 수 있습니다.

    RedisResponse_RoomList_Create:
      type: object
      properties:
        userId:
          type: string
        topic:
          type: string
        payload:
          type: object
          properties:
            eventType:
              type: string
              enum: [CREATE]
            eventAt:
              type: string
              format: date-time
            data:
              $ref: '#/components/schemas/RoomSummaryRes'

    RedisResponse_RoomList_Update:
      type: object
      properties:
        userId:
          type: string
        topic:
          type: string
        payload:
          type: object
          properties:
            eventType:
              type: string
              enum: [ UPDATE ]
            eventAt:
              type: string
              format: date-time
            data:
              $ref: '#/components/schemas/RoomSummaryRes'

    RedisResponse_RoomList_Delete:
      type: object
      properties:
        userId:
          type: string
        topic:
          type: string
        payload:
          type: object
          properties:
            eventType:
              type: string
              enum: [ DELETE ]
            eventAt:
              type: string
              format: date-time
            data:
              $ref: '#/components/schemas/RoomSummaryRes'

    RedisResponse_RoomChat:
      type: object
      properties:
        userId:
          type: string
        topic:
          type: string
        payload:
          type: object
          properties:
            eventType:
              type: string
              enum: [CHAT]
            eventAt:
              type: string
              format: date-time
            data:
              $ref: '#/components/schemas/RoomChatMessage'

    RedisResponse_RoomJoin:
      type: object
      properties:
        userId:
          type: string
        topic:
          type: string
        payload:
          type: object
          properties:
            eventType:
              type: string
              enum: [JOIN]
            eventAt:
              type: string
              format: date-time
            data:
              type: array
              items:
                $ref: '#/components/schemas/RoomUserInfo'

    RedisResponse_RoomReady:
      type: object
      properties:
        userId:
          type: string
        topic:
          type: string
        payload:
          type: object
          properties:
            eventType:
              type: string
              enum: [ READY ]
            eventAt:
              type: string
              format: date-time
            data:
              type: string
              description: 레디를 한 사용자의 UUID

    RedisResponse_RoomUnReady:
      type: object
      properties:
        userId:
          type: string
        topic:
          type: string
        payload:
          type: object
          properties:
            eventType:
              type: string
              enum: [ UNREADY ]
            eventAt:
              type: string
              format: date-time
            data:
              type: string
              description: 레디 취소를 한 사용자의 UUID

    RedisResponse_RoomExit:
      type: object
      properties:
        userId:
          type: string
        topic:
          type: string
        payload:
          type: object
          properties:
            eventType:
              type: string
              enum: [ EXIT ]
            eventAt:
              type: string
              format: date-time
            data:
              type: string
              description: 퇴장한 사용자의 UUID

    RedisResponse_GameStart:
      type: object
      properties:
        userId:
          type: string
        topic:
          type: string
        payload:
          type: object
          properties:
            eventType:
              type: string
              enum: [START]
            eventAt:
              type: string
              format: date-time
            data:
              type: object
              $ref: '#/components/schemas/AISaysRes'


    AllChatMessage:
      type: object
      properties:
        nickname:
          type: string
        content:
          type: string
        chatType:
          type: string
          enum: [ALL]
        sentAt:
          type: string
          format: date-time

    PrivateChatMessage:
      type: object
      properties:
        nickname:
          type: string
        content:
          type: string
        chatType:
          type: string
          enum: [PRIVATE]
        sentAt:
          type: string
          format: date-time

    RoomChatMessage:
      type: object
      properties:
        nickname:
          type: string
        content:
          type: string
        chatType:
          type: string
          enum: [ROOM]
        sentAt:
          type: string
          format: date-time

    RoomUserInfo:
      type: object
      properties:
        userUuid:
          type: string
        nickname:
          type: string
        ready:
          type: boolean

    RedisReq_PrivateChat:
      type: object
      description: |
        채팅 메시지 전송 요청 객체입니다.
      properties:
        receiverUuid:
          type: string
          nullable: true
          description: |
            - 개인 채팅 시, `receiverUuid'는 필수입니다.
        content:
          type: string
          description: 메시지 내용
      required:
        - content

    RedisReq_AllChat:
      type: object
      description: |
        채팅 메시지 전송 요청 객체입니다.
      properties:
        content:
          type: string
          description: 메시지 내용
      required:
        - content

    RedisRes_AllChat:
      type: object
      description: |
        - 전체 채팅 메시지를 포함하는 Redis 전송 구조
        - 응답 시 ChatType은 ALL, ROOM, PRIVATE중 하나로 전송됩니다.
      properties:
        userId:
          type: string
          nullable: true
          description: null (전체 채팅이므로 사용자 구분 없음)
        topic:
          type: string
          description: Redis로 발행된 전체 채팅 채널명
        payload:
          $ref: '#/components/schemas/AllChatMessage'

    RedisRes_PrivateChat:
      type: object
      description: 특정 사용자에게 전송되는 개인 채팅 메시지 응답 구조입니다.
      properties:
        userId:
          type: string
          description: 수신 대상 사용자의 UUID입니다.
        topic:
          type: string
          description: Redis로 발행된 개인 채팅 채널명 (`/sub/chat/private/{receiverUuid}`)
        payload:
          $ref: '#/components/schemas/PrivateChatMessage'


    RedisResponse_GameEvent:
      type: object
      description: 게임 이벤트 발행 시 해당 방에 있는 유저들에게 전송 될 메시지 구조입니다.
      properties:
        userId:
          type: string
        topic:
          type: string
        payload:
          type: object
          properties:
            eventType:
              type: string
              enum: [ROUND_START, GUESS_START, GUESS_REQUEST, GUESS_SUBMIT, GUESS_RESULT, SCORE_UPDATE, ROUND_END, GAME_END]
            data:
              type: object
              oneOf:
              - $ref: '#/components/schemas/Game'
              - $ref: '#/components/schemas/Round'
              - $ref: '#/components/schemas/Guess'
              - $ref: '#/components/schemas/Word'
              - $ref: '#/components/schemas/Score'
            aiSays:
              type: string
              description: 게임 진행 중 AI에게서 오는 메시지입니다. AI에서 메시지가 오지 않는 이벤트 경우 "null" 값으로 오게 됩니다.
            endTime:
              type: string
              format: date-time
              description : 게임 진행 중 해당 상태의 제출 마감 시간입니다(GUESS_REQUEST 시에 사용).
            eventAt:
              type: string
              format: date-time
              description: 해당 이벤트가 발행된 시간입니다.



    AISaysRes:
      type: object
      description: 게임 시작 시 GPT a
      properties:
        gameData:
          type: object
          description: 게임 진행 중 발생하는 데이터가 전송됩니다(Game, Round, Word, Guess, GamePlayer).
          $ref: '#/components/schemas/Game'
        aiSays:
          type: string
          description: GPT API를 통한 메시지


    Game:
      type: object
      properties:
        roomId:
          type: string
          description: "게임 방의 고유 식별자"
          example: "9827"
        gameType:
          type: string
          description: "게임의 타입"
          enum: [ TRICK_MYOMYO, LULU_ART_EXAM ]
          example: "TRICK_MYOMYO"
        difficulty:
          type: string
          description: "게임 난이도"
          enum: [ BASIC, ADVANCED ]
          example: "BASIC"
        gameStatus:
          type: string
          description: "게임의 현재 상태"
          enum : [ GAME_STARTED, ROUND_STARTED, DRAWING_PHASE, GUESSING_PHASE, ROUND_ENDED, GAME_ENDED ]
        currentRound:
          type: integer
          description: "현재 라운드 번호 (0이면 아직 아무 라운드 시작하지 않음, 1부터 시작)"
          example: 0
        totalRounds:
          type: integer
          description: "전체 라운드 수"
          example: 3
        aiScore:
          type: integer
          description: "AI의 현재 점수"
          example: 0
        scores:
          type: object
          description: "게임 전체 참가자의 현재 점수"
          $ref: "#/components/schemas/Score"
        gamePlayers:
          type: array
          description: "게임에 참여 중인 플레이어 목록"
          items:
            $ref: '#/components/schemas/GamePlayer'
        rounds:
          type: array
          description: "게임의 라운드 정보 목록"
          items:
            $ref: '#/components/schemas/Round'
        winner:
          type: string
          description: "게임 최종 우승자 (playerUuid 또는 'AI' 또는 'players')"
          nullable: true
          example: "AI"

    GamePlayer:
      type: object
      properties:
        playerUuid:
          type: string
          description: "플레이어의 UUID"
          example: "l3lwXGrb"
        nickname:
          type: string
          description: "플레이어의 닉네임"
          example: "test1"

    Round:
      type: object
      properties:
        roundIndex:
          type: integer
          description: "라운드 번호 (0부터 시작)"
          example: 0
        drawingEndTime:
          type: string
          format: date-time
          nullable: true
          description: "그리기 종료 시간 (ISO 8601)"
          example: "null"
        roundWinner:
          type: string
          nullable: true
          description: "라운드 승리자 (playerUuid 또는 'AI' 또는 'players')"
          example: "null"
        currentWordIndex:
          type: integer
          description: "현재 추측중인 Word 인덱스"
          example: 0
        words:
          type: array
          description: "라운드에서 그릴/맞출 단어 목록"
          items:
            $ref: '#/components/schemas/Word'
    Word:
      type: object
      properties:
        wordIndex:
          type: integer
          description: "단어 인덱스"
          example: 0
        word:
          type: string
          description: "제시어"
          example: "bush"
        drawerUuid:
          type: string
          description: "그림을 그린 플레이어의 UUID"
          example: "l3lwXGrb"
        submitted:
          type: boolean
          description: "해당 그림이 제출되었는지 여부"
          example: false
        imageURL:
          type: string
          description: "해당 그림의 URL"
          example: "https://gotchaai-image-bucket.s3.ap-northeast-2.amazonaws.com/l3lwXGrb/546258da-8e18-4792-8b35-5b8f8c92bcec.png"
        aiGuesses:
          type: array
          description: "AI 플레이어의 추측 목록"
          items:
            $ref: '#/components/schemas/Guess'
        playerGuesses:
          type: array
          description: "사용자의 추측 목록"
          items:
            $ref: '#/components/schemas/Guess'
        aiPredictions:
          type: array
          description: "AI 모델의 분류 결과(상위 3개)"
          items:
            $ref: '#/components/schemas/AIPrediction'
    Guess:
      type: object
      properties:
        guesserUuid:
          type: string
          description: "추측을 시도한 플레이어의 UUID(AI일 경우 'AI')"
          example: "z2E63KqK"
        guessWord:
          type: string
          description: "플레이어의 추측 단어"
          example: "tree"
        attempts:
          type: integer
          description: "플레이어의 추측 시도 수"
          example: 1
        correct:
          type: boolean
          description: "플레이어의 추측 정답 여부"
          example: true


    AIPrediction:
      type: object
      properties:
        predicted:
          type: string
          description: "AI의 추측 단어"
          example: "apple"
        confidence:
          type: number
          format: float
          description: "AI 추측의 신뢰도 (0~1)"
          example: 0.85

    Score:
      type: object
      description: 유저별 점수, useruuid - score 형태의 Map
      additionalProperties:
        type: integer
        description: 획득한 점수
      example:
        AI: 0
        z2E63KqK: 3
        l3lwXGrb: 6