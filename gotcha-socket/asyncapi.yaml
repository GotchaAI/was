asyncapi: '2.6.0'
id: 'gotcha:websocket-api'
defaultContentType: application/json

info:
  title: Gotcha WebSocket API
  version: '1.0.0'
  description: |
    이 문서는 Gotcha 게임 플랫폼의 실시간 WebSocket(STOMP) 통신 명세서입니다.
    SockJS를 통해 WebSocket 연결을 시도합니다.

    | 주체             | 동작       | 사용하는 STOMP 함수       | 경로 예시              |
    |------------------|------------|---------------------------|-------------------------|
    | 클라이언트 → 서버 | 메시지 보냄 | `stompClient.send()`      | `/pub/**`      |
    | 서버 → 클라이언트 | 메시지 보냄 | `stompClient.subscribe()` | `/sub/**`         |

    ⭐[도메인 채널 prefix]
    -
    
    본 서비스는 총 4개의 메시지 전송 경로(prefix)를 사용하며, 구체적인 로직 분기는 경로가 아닌 DTO 필드로 구분됩니다. 

    - /pub/room/{roomId} : 대기방 관련 로직들 (대기방 내 채팅 포함)
    - /pub/chat/** : 채팅 관련 로직들 (전체 채팅 및 개인 채팅)
    - /pub/game/{roomId} : 게임 관련 로직들 
    - /pub/lobby/** : 로비 관련 로직들 

    ⭐[에러 채널]
    -

    - 대기방 에러 채널 : /user/room/errors/{userUuid}
    - 로비 에러 채널 : /user/lobby/errors/{userUuid}
    - 채팅 에러 채널 : /user/chat/errors/{userUuid}
    - 게임 에러 채널 : /user/game/errors/{userUuid}
    - 기본 에러 채널 : /user/queue/errors/{userUuid}



servers:
  production:
    url: http://43.203.244.35:8080/ws-connect
    protocol: ws
    description: >
      SockJS 기반 STOMP WebSocket 연결을 지원합니다.
      기본적으로 WebSocket(ws) 사용, 실패 시 HTTP long-polling 등 으로 fallback 됩니다.

      핸드쉐이크 시, 반드시 HTTP 헤더에
      Authorization: Bearer {JWT 토큰}
      를 포함해야 합니다.


channels:
  /user/queue/errors/{userUuid}:
    description: |
      도메인 에러 외 서버에서 발생된 에러 메시지를 수신하는 WebSocket 구독 채널입니다.
    parameters:
      userUuid:
        description: 에러 메시지를 수신할 사용자의 UUID
        schema:
          type: string
    subscribe:
      message:
        name: ExceptionResponse
        summary: 에러 응답 메시지
        payload:
          $ref: '#/components/schemas/ExceptionRes'

  /user/room/errors/{userUuid}:
    description: |
      대기방에서 발생한 에러 메시지를 수신하는 WebSocket 구독 채널입니다. (대기방 채팅에서 발생된 에러도 포함됩니다.)
    parameters:
      userUuid:
        description: 에러 메시지를 수신할 사용자의 UUID
        schema:
          type: string
    subscribe:
      message:
        name: ExceptionResponse
        summary: 에러 응답 메시지
        payload:
          $ref: '#/components/schemas/ExceptionRes'

  /user/game/errors/{userUuid}:
    description: |
      게임에서 발생한 에러 메시지를 수신하는 WebSocket 구독 채널입니다.
    parameters:
      userUuid:
        description: 에러 메시지를 수신할 사용자의 UUID
        schema:
          type: string
    subscribe:
      message:
        name: ExceptionResponse
        summary: 에러 응답 메시지
        payload:
          $ref: '#/components/schemas/ExceptionRes'

  /user/lobby/errors/{userUuid}:
    description: |
      로비에서 발생한 에러 메시지를 수신하는 WebSocket 구독 채널입니다.
    parameters:
      userUuid:
        description: 에러 메시지를 수신할 사용자의 UUID
        schema:
          type: string
    subscribe:
      message:
        name: ExceptionResponse
        summary: 에러 응답 메시지
        payload:
          $ref: '#/components/schemas/ExceptionRes'

  /user/chat/errors/{userUuid}:
    description: |
      채팅(전체체팅 및 개인 채팅)에서 발생한 에러 메시지를 수신하는 WebSocket 구독 채널입니다.
    parameters:
      userUuid:
        description: 에러 메시지를 수신할 사용자의 UUID
        schema:
          type: string
    subscribe:
      message:
        name: ExceptionResponse
        summary: 에러 응답 메시지
        payload:
          $ref: '#/components/schemas/ExceptionRes'

  /pub/lobby/create:
    description: 클라이언트가 새 방을 생성 요청하는 채널
    publish:
      message:
        payload:
          $ref: '#/components/schemas/CreateRoomRequest'

  /sub/lobby/create/{userUuid}:
    description: 클라이언트가 새 방을 생성 응답하는 채널
    parameters:
      userUuid:
        description: 사용자의 UUID
        schema:
          type: string
    subscribe:
      message:
        payload:
          $ref: '#/components/schemas/RoomIdRes'

  /pub/lobby/join/{roomId}:
    description: 클라이언트가 방에 참가 요청하는 채널
    parameters:
      roomId:
        description: 대기방의 고유 식별자
        schema:
          type: string
    publish:
      message:
        payload:
          $ref: '#/components/schemas/CreateRoomRequest'

  /sub/lobby/join/{userUuid}:
    description: 클라이언트가 방에 참가 응답 채널
    parameters:
      userUuid:
        description: 사용자의 UUID
        schema:
          type: string
    subscribe:
      message:
        payload:
          $ref: '#/components/schemas/RoomIdRes'

  /sub/lobby/list/event:
    description: 클라이언트가 대기방의 목록을 업데이트 하기 위해 이벤트 정보와 대기방의 요약 정보를 받아오는 채널
    subscribe:
      message:
        oneOf:
          - name: Room Create
            summary: 새로운 방 생성됨
            payload:
              $ref: '#/components/schemas/RedisResponse_RoomList_Create'

          - name: Room Update
            summary: 방 정보 수정됨
            payload:
              $ref: '#/components/schemas/RedisResponse_RoomList_Update'

          - name: Room Delete
            summary: 방 삭제됨
            payload:
              $ref: '#/components/schemas/RedisResponse_RoomList_Delete'

  /pub/room/{roomId}:
    description: |
      클라이언트가 대기방 내에서 발생 가능한 로직 요청을 전송하는 채널입니다.

      [사용 가능한 이벤트 타입]
      - CHAT: 대기방 채팅
      - READY: 준비
      - UNREADY: 준비 해제
      - EXIT: 방 퇴장
      - UPDATE: 방 정보 수정
      - START: 게임 시작
      - OWNER_CHANGE: 방장 권한 위임
      - KICK: 플레이어 강퇴

      `eventType` 값에 따라 content의 의미는 다르게 해석됩니다.
    parameters:
      roomId:
        description: 대상 대기방의 고유 ID
        schema:
          type: string
    publish:
      message:
        name: RoomEventRequest
        summary: 대기방 내 요청 이벤트 전송
        contentType: application/json
        payload:
          $ref: '#/components/schemas/RoomReq'

  /sub/room/{roomId}:
    description: |
      클라이언트가 대기방 내에서 발생 가능한 로직 처리 결과를 응답 받는 채널입니다.
    parameters:
      roomId:
        description: 대기방 고유 ID
        schema:
          type: string
    subscribe:
      message:
        oneOf:
          - name: ChatEvent
            summary: CHAT 이벤트 - 채팅 메시지 수신
            payload:
              $ref: '#/components/schemas/RedisResponse_RoomChat'

          - name: ReadyEvent
            summary: READY 이벤트 - 준비
            payload:
              $ref: '#/components/schemas/RedisResponse_RoomReady'

          - name: UnReadyEvent
            summary: UnREADY 이벤트 - 준비 해제
            payload:
              $ref: '#/components/schemas/RedisResponse_RoomUnReady'

          - name: ExitEvent
            summary: EXIT 이벤트 - 퇴장 정보
            payload:
              $ref: '#/components/schemas/RedisResponse_RoomExit'

          - name: StartEvent
            summary: START 이벤트 - 게임 시작 알림(게임 메타데이터 포함)
            payload:
              $ref: '#/components/schemas/RedisResponse_GameStart'

          - name: Room Update
            summary: UPDATE 이벤트 - 방정보 및 유저 리스트 반환
            payload:
              $ref: '#/components/schemas/RedisResponse_RoomList_Update'

  /pub/chat/all:
    description: 클라이언트가 전체 채팅 메시지를 전송하는 채널
    publish:
      message:
        payload:
          $ref: '#/components/schemas/RedisReq_AllChat'

  /sub/chat/all:
    description: 클라이언트가 전체 채팅 메시지를 수신하는 채널
    subscribe:
      message:
        name: AllChatMessage
        summary: 전체 채팅 메시지 수신
        payload:
          $ref: '#/components/schemas/RedisRes_AllChat'

  /pub/chat/private:
    description: 클라이언트가 특정 사용자에게 개인 채팅(귓속말) 메시지를 전송하는 채널입니다. `receiverUuid`에 수신 대상 사용자의 UUID를 지정하여 메시지를 전송합니다
    publish:
      message:
        payload:
          $ref: '#/components/schemas/RedisReq_PrivateChat'

  /sub/chat/private/{receiverId}:
    description: 개인 채팅 메시지를 수신하는 구독 채널입니다.
    parameters:
      receiverId:
        description: ID of the message receiver
        schema:
          type: string
    subscribe:
      message:
        name: PrivateMessage
        summary: 개인 채팅 메시지 수신
        payload:
          $ref: '#/components/schemas/RedisRes_PrivateChat'

  /pub/game/{roomId}:
    description: 클라이언트가 게임 내 이벤트를 전송하는 채널입니다. `eventType` 필드에 따라 서버가 게임 로직을 분기 처리합니다.
    parameters:
      roomId:
        description: 게임이 진행 중인 방의 고유 식별자
        schema:
          type: string
    publish:
      message:
        oneOf:
          - name: DrawingSubmitEvent
            summary: DRAWING_SUBMIT - 그림 URL 전송
            payload:
              $ref: '#/components/schemas/DrawingSubmitReq'

          - name: GuessSubmitEvent
            summary: GUESS_SUBMIT - 플레이어의 정답 시도 제출
            payload:
              $ref: '#/components/schemas/Guess'



  /sub/game/{roomId}:
    description: |
      게임 흐름 관련 메시지를 수신하는 구독 채널입니다.
      
      [ 발생 가능한 메시지 타입 ]
      
      - `ROUND_START`: 라운드의 시작을 알립니다. 
        - `payload`의 `data` 필드에는 해당 라운드의 메타정보(사용자 별 그려야 하는 제시어)를 알리기 위해 `Round` 타입이 전송됩니다.
      - `GUESS_START`: 추측 단계의 시작을 알립니다. 
        - `payload`의 `data` 필드에는 추측을 위한 정보들인 제시어 list가 전송됩니다. 
        - 클라이언트에서는 `drawerUuid` 필드와 `imageURL` 필드를 확인해 그림을 그린 플레이어와 그림을 맞출 플레이어를 구분할 수 있습니다.
      - `GUESS_REQUEST`: 추측 요청 브로드캐스트입니다. 
        - `payload`의 `data` 필드에는 추측을 위한 메타정보인 `guess` 데이터가 전송됩니다. 
        - `guesserUuid` 필드가 AI인 경우 잠시 후 AI 추측결과가 `GUESS_SUBMIT`으로 함께 브로드캐스트 됩니다. 
        - `guesserUuid` 필드가 AI가 아닌 경우 클라이언트에서 해당 `guesserUuid`의 `GUESS_SUBMIT`을 기다리게 됩니다.  
        - 또한 `endTime` 필드가 이벤트 발행 시점의 30초 후로 설정되며, 클라이언트에서는 이 시간 안에 `GUESS_SUBMIT`을 보내주어야 합니다. 
      - `GUESS_SUBMIT`:  추측 데이터 제출 브로드캐스트입니다. 
        - 해당 턴의 추측 데이터 제출 시 이를 브로드캐스트 합니다. 
        - `payload`의 `data` 필드에는 `Guess` 데이터가 전송됩니다. 
      - `GUESS_RESULT`: 추측 결과를 클라이언트에 브로드캐스트합니다.
        - `payload`의 `data` 필드에는 `guess` 데이터가 정답 여부와 함께 전송됩니다.
      - `SCORE_UPDATE`: 추측 성공 시 점수 현황을 업데이트 해주고, 이를 브로드캐스트 해줍니다. 
        - 추측 실패 시에는 전송되지 않습니다. 
        - `payload`의 `data` 필드에는 `Score` 데이터가 전송됩니다. 
      - `ROUND_END`: 해당 라운드의 종료를 알립니다.
        - 라운드 종료 시 해당 라운드의 결과를 포함한 라운드 데이터를 브로드캐스트 해줍니다. 
        - `payload`의 `data` 필드에는 `round` 데이터가 전송됩니다. 
      - `GAME_END`: 게임 종료 시 해당 게임의 결과를 포함한 게임 데이터를 브로드캐스트 해줍니다. 
        - `payload`의 `data` 필드에는 `game` 데이터가 전송됩니다. 

    parameters:
      roomId:
        description: 현재 게임이 진행 중인 방의 ID
        schema:
          type:
            string
    subscribe:
      message:
        oneOf:
          - name: ROUND_START
            payload:
              $ref: '#/components/schemas/RedisResponse_RoundStart'
          - name: GUESS_START
            payload:
              $ref: '#/components/schemas/RedisResponse_GuessStart'
          - name: GUESS_REQUEST
            payload:
              $ref: '#/components/schemas/RedisResponse_GuessRequest'
          - name: GUESS_SUBMIT
            payload:
              $ref: '#/components/schemas/RedisResponse_GuessSubmit'
          - name: GUESS_RESULT
            payload:
              $ref: '#/components/schemas/RedisResponse_GuessResult'
          - name: SCORE_UPDATE
            payload:
              $ref: "#/components/schemas/RedisResponse_ScoreUpdate"
          - name: ROUND_END
            payload:
              $ref: "#/components/schemas/RedisResponse_RoundEnd"
          - name: GAME_END
            payload:
              $ref: "#/components/schemas/RedisResponse_GameEnd"



components:

  schemas:
    ExceptionRes:
      type: object
      description: API 예외 응답 구조
      properties:
        code:
          type: string
          description: 에러 코드
        status:
          type: integer
          format: int32
          description: HTTP 상태 코드
        message:
          type: string
          description: 에러 메시지
        fields:
          type: object
          description: 필드별 상세 오류 메시지 (있을 경우)
          additionalProperties:
            type: string
      required:
        - code
        - status
        - message

    CreateRoomRequest:
      type: object
      required:
        - title
        - maxUser
        - hasPassword
        - difficulty
        - gameType
        - roundCount
      properties:
        title:
          type: string
          description: 제목 (필수 입력)

        maxUser:
          type: integer
          description: 최대 인원수 (필수 입력)

        hasPassword:
          type: boolean
          description: 비밀번호 사용 여부

        password:
          type: string
          description: 문자열이 숫자 4자리로만 구성되어 있어야 한다

        difficulty:
          type: string
          enum: [BASIC, ADVANCED]
          description: 인공지능 난이도 (필수)

        gameType:
          type: string
          enum: [TRICK_MYOMYO, LULU_ART_EXAM]
          description: 묘묘 - 2인 / 루루 - 1인 게임 모드

        roundCount:
          type: integer
          minimum: 1
          maximum: 5
          description: 라운드 수 (1~5 사이)

    RoomReq:
      type: object
      required:
        - eventType
      properties:
        eventType:
          type: string
          enum: [CHAT, READY, JOIN, EXIT, UNREADY, START, OWNER_CHANGE, KICK]
          description: |
            클라이언트가 수행하고자 하는 이벤트의 종류입니다.
        content:
          type: string
          description: |
            이벤트에 따라 의미가 달라지는 콘텐츠입니다.
            - CHAT: 채팅 메시지
            - JOIN: 비밀번호가 있는 대기방의 경우 비밀번호, 비밀번호가 없다면 안보내도 됩니다.
            - KICK: 강퇴하고자 하는 사용자의 UUID
            - UPDATE: 방의 정보(title, hasPassword, password, difficulty, roundCount)를 json문자열 형태로 보냅니다.
            - OWNER_CHANGE: 방장 권한을 위임하고자 하는 사용자의 UUID
            - 나머지는 content를 사용하지 않습니다.

    RedisResponse_RoomMetadata:
      type: object
      description: 방 생성/요청 응답용 Redis 메시지 (RoomMetadata 포함)
      properties:
        userId:
          type: string
          description: 메시지를 보낸 사용자 UUID
        topic:
          type: string
          description: Redis로 발행된 채널명
        payload:
          $ref: '#/components/schemas/RoomMetadata'

    RoomSummaryRes:
      type: object
      properties:
        roomId:
          type: string
          description: 방 ID
        title:
          type: string
          description: 방 제목
        owner:
          type: string
          description: 방장 닉네임
        hasPassword:
          type: boolean
          description: 비밀번호 사용 여부
        maxUser:
          type: integer
          description: 최대 인원 수
        currentUser:
          type: integer
          description: 현재 인원 수

    RoomMetadata:
      type: object
      properties:
        id:
          type: string
          description: 방 ID
        title:
          type: string
          description: 방 제목
        owner:
          type: string
          description: 방장 닉네임
        hasPassword:
          type: boolean
          description: 비밀번호 사용 여부
        password:
          type: string
          description: 비밀번호 (빈 문자열일 수 있음)
        max:
          type: integer
          description: 최대 인원 수
        min:
          type: integer
          description: 최소 인원 수
        aiLevel:
          type: string
          enum: [BASIC, ADVANCED]
          description: AI 난이도
        gameMode:
          type: string
          enum: [TRICK_MYOMYO, LULU_ART_EXAM]
          description: 게임 모드
        ownerUuid:
          type: string
          description: |
            이 방을 생성한 사용자의 UUID입니다.  
            클라이언트는 해당 값을 통해 수신된 방 정보가 본인이 생성한 것인지 식별할 수 있습니다.

    RedisResponse_RoomList_Create:
      type: object
      properties:
        userId:
          type: string
        topic:
