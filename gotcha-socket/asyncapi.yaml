          example: "l3lwXGrb"
        submitted:
          type: boolean
          description: "해당 그림이 제출되었는지 여부"
          example: false
        imageURL:
          type: string
          description: "해당 그림의 URL"
          example: "https://gotchaai-image-bucket.s3.ap-northeast-2.amazonaws.com/l3lwXGrb/546258da-8e18-4792-8b35-5b8f8c92bcec.png"
        aiGuesses:
          type: array
          description: "AI 플레이어의 추측 목록"
          items:
            $ref: '#/components/schemas/Guess'
        playerGuesses:
          type: array
          description: "사용자의 추측 목록"
          items:
            $ref: '#/components/schemas/Guess'
        aiPredictions:
          type: array
          description: "AI 모델의 분류 결과(상위 3개)"
          items:
            $ref: '#/components/schemas/AIPrediction'
    Guess:
      type: object
      properties:
        guesserUuid:
          type: string
          description: "추측을 시도한 플레이어의 UUID(AI일 경우 'AI')"
          example: "z2E63KqK"
        guessWord:
          type: string
          description: "플레이어의 추측 단어"
          example: "tree"
        attempts:
          type: integer
          description: "플레이어의 추측 시도 수"
          example: 1
        correct:
          type: boolean
          description: "플레이어의 추측 정답 여부"
          example: true


    AIPrediction:
      type: object
      properties:
        predicted:
          type: string
          description: "AI의 추측 단어"
          example: "apple"
        confidence:
          type: number
          format: float
          description: "AI 추측의 신뢰도 (0~1)"
          example: 0.85

    Score:
      type: object
      description: 유저별 점수, useruuid - score 형태의 Map
      additionalProperties:
        type: integer
        description: 획득한 점수
      example:
        AI: 0
        z2E63KqK: 3
        l3lwXGrb: 6

    RoomIdRes:
      type: object
      description: 방 ID를 반환하는 응답 객체
      properties:
        roomId:
          type: string
          description: 생성된 방의 고유 ID
      required:
        - roomId

    DrawingSubmitReq:
      type: object
      description: 그림 제출 요청
      properties:
        imageURL:
          type: string
          format: uri
          description: 업로드된 그림의 URL
      required:
        - imageURL
