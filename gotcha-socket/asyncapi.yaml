          type: string
          description: "게임 난이도"
          enum: [ BASIC, ADVANCED ]
          example: "BASIC"
        gameStatus:
          type: string
          description: "게임의 현재 상태"
          enum : [ GAME_STARTED, ROUND_STARTED, DRAWING_PHASE, GUESSING_PHASE, ROUND_ENDED, GAME_ENDED ]
        currentRound:
          type: integer
          description: "현재 라운드 번호 (0이면 아직 아무 라운드 시작하지 않음, 1부터 시작)"
          example: 0
        totalRounds:
          type: integer
          description: "전체 라운드 수"
          example: 3
        aiScore:
          type: integer
          description: "AI의 현재 점수"
          example: 0
        scores:
          type: object
          description: "게임 전체 참가자의 현재 점수"
          $ref: "#/components/schemas/Score"
        gamePlayers:
          type: array
          description: "게임에 참여 중인 플레이어 목록"
          items:
            $ref: '#/components/schemas/GamePlayer'
        rounds:
          type: array
          description: "게임의 라운드 정보 목록"
          items:
            $ref: '#/components/schemas/Round'
        winner:
          type: string
          description: "게임 최종 우승자 (playerUuid 또는 'AI' 또는 'players')"
          nullable: true
          example: "AI"



    GamePlayer:
      type: object
      properties:
        playerUuid:
          type: string
          description: "플레이어의 UUID"
          example: "l3lwXGrb"
        nickname:
          type: string
          description: "플레이어의 닉네임"
          example: "test1"

    Round:
      type: object
      properties:
        roundIndex:
          type: integer
          description: "라운드 번호 (0부터 시작)"
          example: 0
        drawingEndTime:
          type: string
          format: date-time
          nullable: true
          description: "그리기 종료 시간 (ISO 8601)"
          example: "null"
        roundWinner:
          type: string
          nullable: true
          description: "라운드 승리자 (playerUuid 또는 'AI' 또는 'players')"
          example: "null"
        currentWordIndex:
          type: integer
          description: "현재 추측중인 Word 인덱스"
          example: 0
        words:
          type: array
          description: "라운드에서 그릴/맞출 단어 목록"
          items:
            $ref: '#/components/schemas/Word'
    Word:
      type: object
      properties:
        wordIndex:
          type: integer
